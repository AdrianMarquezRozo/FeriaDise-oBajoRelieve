<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#09090b">
    <title>Marcas | Grandes Ideas</title>
    
    <!-- OpenGraph Meta Tags -->
    <meta property="og:title" content="Marcas Aliadas">
    <meta property="og:description" content="Marcas que hacen posible grandes ideas.">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Colores de Fondo y Texto (Dark Luxury) */
            --bg-matte: #09090b;
            --text-pure: #ffffff;
            --text-muted: #a1a1aa;
            
            /* Interacciones */
            --card-border: rgba(255, 255, 255, 0.1);
            --card-bg-hover: rgba(255, 255, 255, 0.04);
            --card-bg-active: rgba(255, 255, 255, 0.08);
            
            /* Tiempos de Animación */
            --transition-speed: 0.25s;
        }

        /* Reset Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-matte);
            color: var(--text-pure);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 24px;
            overscroll-behavior-y: none; /* Previene rebotes nativos en iOS */
        }

        .totem-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 48px;
            margin-top: 4vh; /* Centrado vertical óptico */
        }

        .header {
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        .header-subtitle {
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.25em; /* Tracking abierto para look Premium */
            color: var(--text-muted);
            text-transform: uppercase;
            line-height: 1.6;
        }

        .brands-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            list-style: none;
        }

        .brand-item {
            opacity: 0;
            transform: translateY(10px);
            animation: slideUp 0.6s ease-out forwards;
        }

        .brand-button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 72px; /* Área táctil muy generosa (Ergonomía pulgar) */
            background-color: transparent;
            border: 1px solid var(--card-border);
            border-radius: 4px;
            color: var(--text-pure);
            text-decoration: none;
            transition: background-color var(--transition-speed), 
                        transform var(--transition-speed), 
                        border-color var(--transition-speed),
                        box-shadow var(--transition-speed);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            padding: 15px 10px; /* Padding para que el logo respire */
        }

        @media (hover: hover) {
            .brand-button:hover {
                background-color: var(--card-bg-hover);
                border-color: rgba(255, 255, 255, 0.3);
                box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
            }
        }

        .brand-button:active {
            transform: scale(0.98);
            background-color: var(--card-bg-active);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* --- AQUÍ ESTÁ LA MAGIA PARA LOS LOGOS --- */
        .brand-logo-img {
            max-width: 80%;       /* Nunca será más ancho que el botón */
            max-height: 45px;      /* Altura estándar controlada */
            object-fit: contain;   /* Mantiene la proporción sin deformar */
            pointer-events: none;
            
            /* ESTE ES EL FILTRO QUE VUELVE TODO BLANCO BRILLANTE */
            filter: brightness(0) invert(1); 
        }

        /* Ajustes finos para logos específicos si lo necesitan */
        .logo-bajorelieve { max-height: 55px; } /* Es circular, puede ser más alto */
        .logo-monte { max-height: 25px; }       /* Es muy ancho, mejor que no sea tan alto */

        /* Estilos para el texto de respaldo (si la imagen falla) */
        .fallback-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <main class="totem-container">
        <header class="header">
            <h1 class="header-subtitle">Marcas que hacen<br>posible grandes ideas.</h1>
        </header>

        <!-- Contenedor inyectado por JS -->
        <ul class="brands-list" id="brands-container">
        </ul>
    </main>

    <script>
        const BRANDS = [
            {
                id: 'bajo-relieve',
                name: 'Bajo Relieve',
                handle: 'bajorelieveco',
                url: 'https://www.instagram.com/bajorelieveco?igsi=MTM5NDc5Y3Z2bHNmeA==',
                imgSrc: './assets/bajo-relieve.png', 
                imgClass: 'logo-bajorelieve'
            },
            {
                id: 'monte',
                name: 'Monte',
                handle: 'montestone.co',
                url: 'https://www.instagram.com/montestone.co?igsi=N280eDVkZmxmMmdu',
                imgSrc: './assets/monte.png', 
                imgClass: 'logo-monte'
            },
            {
                id: 'alsada',
                name: 'Alsada',
                handle: 'alsadaoficial',
                url: 'https://www.instagram.com/alsadaoficial?igsi=MXgzOXR1MmdyMnZibA==',
                imgSrc: './assets/alsada.png', 
                imgClass: 'logo-alsada'
            },
            {
                id: 'posh-lamps',
                name: 'Posh Lamps',
                handle: 'poshlamp',
                url: 'https://www.instagram.com/poshlamp?igsi=MXE0Ynh4eWtvemR4dA==',
                imgSrc: './assets/posh-lamps.png', 
                imgClass: 'logo-poshlamps'
            },
            {
                id: 'thor',
                name: 'THOR',
                handle: 'thorkitchen.co',
                url: 'https://www.instagram.com/thorkitchen.co?igsi=cDRxdTNjbzdoa3Ny',
                imgSrc: './assets/thor.png', 
                imgClass: 'logo-thor'
            }
        ];

        function handleBrandClick(event, handle, webUrl) {
            event.preventDefault();
            
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isMobile = /iPad|iPhone|iPod|Android/.test(userAgent) && !window.MSStream;
            
            if (navigator.vibrate) navigator.vibrate(40);

            if (isMobile) {
                const appUri = `instagram://user?username=${handle}`;
                
                const now = Date.now();
                const fallbackTimer = setTimeout(() => {
                    if (Date.now() - now < 2000) {
                        window.location.href = webUrl;
                    }
                }, 1500);

                window.onblur = () => clearTimeout(fallbackTimer);
                window.location.href = appUri;
            } else {
                window.open(webUrl, '_blank');
            }
        }

        function renderTotem() {
            const container = document.getElementById('brands-container');
            const fragment = document.createDocumentFragment();

            BRANDS.forEach((brand, index) => {
                const li = document.createElement('li');
                li.className = 'brand-item';
                li.style.animationDelay = `${index * 0.12}s`; 

                const a = document.createElement('a');
                a.href = brand.url;
                a.className = 'brand-button';
                a.setAttribute('aria-label', `Visitar el Instagram de ${brand.name}`);
                
                a.addEventListener('click', (e) => handleBrandClick(e, brand.handle, brand.url));

                const img = document.createElement('img');
                img.src = brand.imgSrc;
                img.alt = `Logo de ${brand.name}`;
                img.className = `brand-logo-img ${brand.imgClass}`;
                
                img.onerror = function() {
                    this.onerror = null;
                    const fallbackText = document.createElement('span');
                    fallbackText.className = 'fallback-text';
                    fallbackText.textContent = brand.name;
                    a.replaceChild(fallbackText, img);
                };

                a.appendChild(img);
                li.appendChild(a);
                fragment.appendChild(li);
            });

            container.appendChild(fragment);
        }

        document.addEventListener('DOMContentLoaded', renderTotem);
    </script>
</body>
</html>
